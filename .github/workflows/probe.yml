name: Source Probe (one-time)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe Naver option endpoints
        run: |
          python3 - <<'PYEOF'
          import requests, re
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125 Safari/537.36',
                'Accept-Language': 'ko-KR,ko;q=0.9', 'Referer': 'https://finance.naver.com/'}

          # 1. 선물옵션 메뉴 페이지에서 옵션 관련 링크 발굴
          for seed in ['https://finance.naver.com/sise/', 'https://finance.naver.com/fut_opt/']:
              try:
                  r = requests.get(seed, headers=UA, timeout=12)
                  links = sorted(set(re.findall(r'href="([^"]*(?:option|opt|fut)[^"]*)"', r.text, re.I)))[:15]
                  print(f"[SEED {seed}] {r.status_code} links={links}")
              except Exception as e:
                  print(f"[SEED {seed}] EXC {e}")

          # 2. 후보 URL 직접 타격
          cands = [
            'https://finance.naver.com/sise/sise_option.naver',
            'https://finance.naver.com/option/option_list.naver',
            'https://finance.naver.com/fut_opt/option.naver',
            'https://m.stock.naver.com/api/futures/list?page=1&pageSize=5',
            'https://m.stock.naver.com/api/option/list?page=1&pageSize=5',
            'https://api.stock.naver.com/futures/option/KOSPI200',
            'https://m.stock.naver.com/front-api/option/board?category=index',
          ]
          for u in cands:
              try:
                  r = requests.get(u, headers=UA, timeout=12)
                  print(f"[{u}] {r.status_code} len={len(r.text)} | {r.text[:100].replace(chr(10),' ')}")
              except Exception as e:
                  print(f"[{u}] EXC {type(e).__name__}")
          PYEOF
