name: KOSPI200 Put-Call Daily Brief

on:
  schedule:
    - cron: "0 21 * * 0-4"   # 06:00 KST 월–금 (UTC 전일 21:00 일–목)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "백필할 과거 캘린더 일수 (0 = 일일 모드)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: putcall-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          PAGES_URL: "https://jinhae8971.github.io/kospi-putcall-monitor/"
          TZ: "Asia/Seoul"
        run: |
          BACKFILL="${{ github.event.inputs.backfill_days || '0' }}"
          if [ "$BACKFILL" != "0" ]; then
            python putcall_monitor.py --backfill "$BACKFILL"
          else
            python putcall_monitor.py
          fi

      - name: Commit history & dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv docs/data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: update $(date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, requests
          requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["TELEGRAM_CHAT_ID"],
                    "text": "❌ KOSPI200 Put/Call 모니터 실행 실패 — Actions 로그 확인 필요\nhttps://github.com/jinhae8971/kospi-putcall-monitor/actions"},
              timeout=10)
          EOF
